# .gitlab-ci.yml — Java（Maven）war 打包 pipeline 範例
# 對應 Module 3：自動化打包與持續整合（Java 版本）
# 跟 .NET 版本用同一套邏輯（build → test → package → docker），只是工具鏈換成 Maven
# 【課堂重點】同一個團隊、同一套 CI 概念，兩種語言的實作方式不同——這正是為什麼
# 混合技術棧團隊要讓每個人都懂 Pipeline 的「概念」，而不是死背某個語言的指令

stages:
  - build
  - test
  - package
  - docker

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B --no-transfer-progress"   # 批次模式，log 不被下載進度洗版
  IMAGE_TAG: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  # JDK 版本對齊正式環境的 Tomcat/JDK；要完全可重現就改用 digest
  MAVEN_IMAGE: "maven:3.9-eclipse-temurin-17"

# cache 只是加速（不用每次重抓套件），不負責鎖版本。
# 鎖版本靠 pom.xml：每個依賴寫死版本、不用 SNAPSHOT 或版本範圍，多模組用 <dependencyManagement> 統一。
cache:
  key: "$CI_COMMIT_REF_SLUG"
  paths:
    - .m2/repository

build:
  stage: build
  image: $MAVEN_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS compile

test:
  stage: test
  image: $MAVEN_IMAGE
  script:
    - mvn $MAVEN_CLI_OPTS test
  artifacts:
    when: always          # 測試失敗那次的報告最重要，不能被丟掉
    reports:
      junit: target/surefire-reports/TEST-*.xml

package:
  stage: package
  image: $MAVEN_IMAGE
  script:
    # 測試上一個 stage 跑過了，這裡只打包 war
    - mvn $MAVEN_CLI_OPTS package -DskipTests
  artifacts:
    paths:
      - target/*.war
    expire_in: 1 week

docker-build:
  stage: docker
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    # Dockerfile 內把 target/*.war 複製進 tomcat base image（webapps 目錄）
    - docker build -t "$IMAGE_TAG" .
    - docker push "$IMAGE_TAG"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$IMAGE_TAG" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      fi
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG

# 敏感資訊：$CI_REGISTRY_USER / $CI_REGISTRY_PASSWORD 是 GitLab 預先定義、job 結束即失效的變數；
# 自己的機密（Maven 私有庫密碼、部署帳密）才到 Settings → CI/CD → Variables 設 Masked + Protected。
# 細節見 .NET 版檔尾說明。

# 課堂對照表（投影片用）：
#   .NET 版：dotnet restore --locked-mode → dotnet build → dotnet test → dotnet publish
#   Java 版：mvn compile → mvn test → mvn package -DskipTests（.m2 cache 只加速）
#   共同點：都是「build → test → package → docker」四段式，鎖版本，產出不可變交付物
