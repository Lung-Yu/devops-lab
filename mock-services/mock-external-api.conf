# nginx conf — 搭配 docker-compose.yml 的 mock-external-api 服務
# 模擬一個「一定活著」的外部依賴服務，供 M4 Lab 的網路連線檢查練習使用

server {
    listen 80;

    location /health {
        default_type text/plain;
        return 200 'OK';
    }

    location / {
        default_type text/plain;
        return 200 'mock external api\n';
    }
}
